{% extends "base.html" %}
{% block title %}Login | Timesheet AI{% endblock %}

{% block fullpage %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-500 via-accent-500 to-brand-700 dark:from-slate-900 dark:via-slate-800 dark:to-brand-900 p-4">
  <div class="w-full max-w-md">
    <div class="bg-white/95 dark:bg-slate-800/95 backdrop-blur rounded-3xl shadow-2xl p-8 border border-white/20 dark:border-slate-700/50">
      <div class="text-center mb-7">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-accent-500 items-center justify-center mb-3">
          <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Welcome back</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign in to your timesheet dashboard</p>
      </div>

      {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/40 text-sm text-red-700 dark:text-red-400 flex gap-2 items-center">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-400 mb-1.5">Email</label>
          <input name="email" type="email" required autofocus
                 placeholder="you@company.com"
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-400">Password</label>
            <a href="/forgot-password" class="text-xs text-brand-600 dark:text-brand-400 hover:underline font-medium">Forgot password?</a>
          </div>
          <input name="password" type="password" required
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
        </div>
        <button type="submit"
                class="w-full py-2.5 rounded-lg bg-gradient-to-r from-brand-500 to-accent-500 text-white font-semibold hover:opacity-95 transition shadow-lg shadow-brand-500/30">
          Sign in
        </button>
      </form>

    </div>
  </div>
</div>
{% endblock %}

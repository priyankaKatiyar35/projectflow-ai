{% extends "base.html" %}
{% block title %}Change password | Timesheet AI{% endblock %}

{% block content %}
<div class="p-6 lg:p-8 max-w-xl mx-auto" x-data="changePwdApp()">

  <a href="/" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 mb-3">
    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to dashboard
  </a>

  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
    <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2 mb-1">
      <i data-lucide="key-round" class="w-6 h-6 text-brand-500"></i>
      Change password
    </h1>
    <p class="text-sm text-slate-500 mb-6">Update your password by entering your current one first.</p>

    <form @submit.prevent="submit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1.5">Current password</label>
        <input x-model="form.current_password" type="password" required
               class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1.5">New password</label>
        <input x-model="form.new_password" type="password" required minlength="6"
               placeholder="At least 6 characters"
               class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1.5">Confirm new password</label>
        <input x-model="form.new_password_confirm" type="password" required minlength="6"
               class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none">
      </div>

      <div x-show="error" class="p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 flex gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
        <span x-text="error"></span>
      </div>
      <div x-show="success" class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-700 flex gap-2">
        <i data-lucide="check-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
        <span>Password updated successfully!</span>
      </div>

      <button type="submit" :disabled="saving"
              class="w-full py-2.5 rounded-lg bg-gradient-to-r from-brand-500 to-accent-500 text-white font-semibold disabled:opacity-50">
        <span x-text="saving ? 'Updating...' : 'Update password'"></span>
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function changePwdApp() {
  return {
    form: { current_password: '', new_password: '', new_password_confirm: '' },
    error: '',
    success: false,
    saving: false,

    async submit() {
      this.error = '';
      this.success = false;

      if (this.form.new_password !== this.form.new_password_confirm) {
        this.error = 'New passwords do not match.';
        return;
      }
      if (this.form.new_password.length < 6) {
        this.error = 'New password must be at least 6 characters.';
        return;
      }

      this.saving = true;
      try {
        const r = await fetch('/api/change-password', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            current_password: this.form.current_password,
            new_password: this.form.new_password,
          }),
        });
        if (!r.ok) {
          const e = await r.json();
          throw new Error(e.detail || 'Failed');
        }
        this.success = true;
        this.form = { current_password: '', new_password: '', new_password_confirm: '' };
      } catch (e) {
        this.error = e.message;
      } finally {
        this.saving = false;
      }
    },
  };
}
</script>
{% endblock %}
